name: CI - Gradle + Serenity BDD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clona el repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Configura Java
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. Da permiso de ejecución a gradlew
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 4. Ejecuta las pruebas y genera reportes de Serenity
      - name: Run tests with Gradle
        run: ./gradlew clean test aggregate

      # 5. Guarda los reportes como artefactos para descargarlos
      - name: Upload Serenity Reports
        uses: actions/upload-artifact@v4
        with:
          name: SerenityReports
          path: build/site/serenity
